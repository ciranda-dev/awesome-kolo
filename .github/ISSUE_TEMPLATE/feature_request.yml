name: Suggest a change
description: Suggest an entry or a change to the list
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "What you want to add or change"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "The entry or change you propose"
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you considered"
  - type: dropdown
    id: pr
    attributes:
      label: "Are you willing to send a pull request?"
      options:
        - "Yes"
        - "Yes, with some guidance"
        - "No"
